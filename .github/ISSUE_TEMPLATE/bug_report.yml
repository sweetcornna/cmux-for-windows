name: Bug report
description: Report a reproducible problem in cmux for Windows
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is the independently maintained Windows fork. Do not use this form for the upstream macOS application. Remove secrets and terminal contents from logs before submitting them.

  - type: input
    id: version
    attributes:
      label: cmux for Windows version
      description: Use the installed version or the commit hash for a source build.
      placeholder: "0.2.1 or commit 0123456"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Run `winver` and include the edition, version, and OS build.
      placeholder: "Windows 11 24H2, OS build 26100.x"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Native WinUI GUI
        - Terminal rendering or input
        - Workspace, split, or tab persistence
        - Standalone TUI or resource CLI
        - Installer, upgrade, or uninstall
        - Explorer integration
        - Settings, themes, or localization
        - Experimental browser pane
        - Build from source
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Per-user Setup executable
        - Development MSIX
        - Unpackaged source build
        - Standalone TUI binary
    validations:
      required: true

  - type: input
    id: shell
    attributes:
      label: Shell
      description: Include the executable and version when the issue involves a terminal.
      placeholder: "PowerShell 7.5 (pwsh.exe)"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start cmux.
        2. Create ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Review `%LOCALAPPDATA%\cmux-gui.log` and remove local paths, personal data, credentials, and terminal content before pasting relevant lines.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, recordings, display scaling, input method, or other relevant details.

  - type: checkboxes
    id: scope
    attributes:
      label: Fork scope confirmation
      options:
        - label: I confirmed this report affects the Windows fork rather than only the upstream macOS project.
          required: true
