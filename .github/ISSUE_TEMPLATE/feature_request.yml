name: Feature request
description: Suggest a Windows-focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This fork focuses on the native Windows GUI, Windows TUI, local multiplexer, and their packaging. macOS, iOS, cloud-machine, and Unix remote-daemon requests are out of scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the Windows user problem, not only a proposed implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what cmux should do and how a user would interact with it.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Primary area
      options:
        - Native WinUI GUI
        - Terminal or ConPTY behavior
        - Workspaces, panes, tabs, or persistence
        - Standalone TUI or local resource CLI
        - Installer or Explorer integration
        - Settings, themes, accessibility, or localization
        - Documentation or contributor tooling
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing Windows tools or workarounds that do not solve the problem.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, accessibility needs, or links to related issues.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request is for the independently maintained Windows fork.
          required: true
