[package]
name = "cmux-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Native GUI frontend for cmux, rendering the cmux-tui engine with wgpu"

[lints]
workspace = true

[dependencies]
cmux-tui-core.workspace = true
ghostty-vt.workspace = true
anyhow.workspace = true

winit = "0.30"
wgpu = "30"
glyphon = "0.12"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
